event_registration.form_schema:
  path: '/api/event-registration/{node}/schema'
  defaults:
    _controller: '\Drupal\event_registration\Controller\EventRegistrationController::schema'
  methods: [GET]
  requirements:
    _permission: 'access content'
    node: \d+
  options:
    parameters:
      node:
        type: 'entity:node'
    no_cache: TRUE

event_registration.submit:
  path: '/api/event-registration/{node}/submit'
  defaults:
    _controller: '\Drupal\event_registration\Controller\EventRegistrationController::submit'
  methods: [POST]
  requirements:
    _permission: 'manage own event registrations'
    node: \d+
  options:
    parameters:
      node:
        type: 'entity:node'
    no_cache: TRUE

event_registration.my_registrations:
  path: '/api/my-event-registrations'
  defaults:
    _controller: '\Drupal\event_registration\Controller\EventRegistrationController::myRegistrations'
  methods: [GET]
  requirements:
    _permission: 'manage own event registrations'
  options:
    no_cache: TRUE

event_registration.login_link:
  path: '/api/event-registration/{node}/login-link'
  defaults:
    _controller: '\Drupal\event_registration\Controller\EventRegistrationController::mobileLoginLink'
  methods: [POST]
  requirements:
    _user_is_logged_in: 'TRUE'
    node: \d+
  options:
    parameters:
      node:
        type: 'entity:node'
    no_cache: TRUE

event_registration.mobile_login:
  path: '/mobile-login/{token}'
  defaults:
    _controller: '\Drupal\event_registration\Controller\EventRegistrationController::mobileLogin'
  methods: [GET]
  requirements:
    _access: 'TRUE'
    token: '[a-f0-9]{64}'
  options:
    no_cache: TRUE

event_registration.me:
  path: '/api/me'
  defaults:
    _controller: '\Drupal\event_registration\Controller\EventRegistrationController::me'
  methods: [GET]
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: TRUE

event_registration.participants:
  path: '/api/event-registration/{node}/participants'
  defaults:
    _controller: '\Drupal\event_registration\Controller\EventRegistrationController::participants'
  methods: [GET]
  requirements:
    _permission: 'access content'
    node: \d+
  options:
    parameters:
      node:
        type: 'entity:node'
    no_cache: TRUE

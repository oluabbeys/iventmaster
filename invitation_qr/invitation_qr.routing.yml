    submission: \d+

invitation_qr.download_zip:
  path: '/admin/invitation-qr/download-zip/{node}'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::downloadZip'
    _title: 'Download All Invitation Cards'
  requirements:
    _permission: 'administer invitation qr'
    node: \d+

invitation_qr.download_access_zip:
  path: '/admin/invitation-qr/download-access-zip/{node}'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::downloadAccessZip'
    _title: 'Download All Access Cards'
  requirements:
    _permission: 'administer invitation qr'
    node: \d+

invitation_qr.download_single:
  path: '/admin/invitation-qr/download/{submission}'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::downloadSingle'
    _title: 'Download Invitation Card'
  requirements:
    _permission: 'access invitation qr submissions'
    submission: \d+

invitation_qr.download_access_single:
  path: '/admin/invitation-qr/download-access/{submission}'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::downloadAccessSingle'
    _title: 'Download Access Card'
  requirements:
    _permission: 'access invitation qr submissions'
    submission: \d+

invitation_qr.send_bulk_twilio:
  path: '/admin/invitation-qr/send-bulk/{node}'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::sendBulkTwilio'
    _title: 'Send Selected Invitations'
  methods: [GET]
  requirements:
    _permission: 'administer invitation qr'
    node: \d+

invitation_qr.send_adhoc_twilio:
  path: '/admin/invitation-qr/send-adhoc/{node}'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::sendAdhocTwilio'
    _title: 'Send to Custom Number'
  requirements:
    _permission: 'administer invitation qr'
    node: \d+

invitation_qr.twilio_webhook:
  path: '/invitation-qr/twilio-webhook'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\TwilioWebhookController::incoming'
    _title: 'Twilio Webhook'
  methods: [GET, POST]
  requirements:
    _invitation_qr_webhook_access: 'TRUE'
  options:
    no_cache: TRUE

invitation_qr.send_rsvp_reminder:
  path: '/admin/invitation-qr/rsvp-reminder/{node}'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::sendRsvpReminder'
    _title: 'Send RSVP Reminders'
  requirements:
    _permission: 'administer invitation qr'
    node: \d+

invitation_qr.rsvp_dashboard:
  path: '/admin/invitation-qr/rsvp/{node}'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::rsvpDashboard'
    _title: 'RSVP Dashboard'
  requirements:
    _permission: 'access invitation qr submissions'
    node: \d+
  options:
    no_cache: TRUE

invitation_qr.templates:
  path: '/admin/invitation-qr/templates'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\TemplateManagerController::listTemplates'
    _title: 'Message Templates'
  requirements:
    _permission: 'administer site configuration'

invitation_qr.template_add:
  path: '/admin/invitation-qr/templates/add'
  defaults:
    _form: '\Drupal\invitation_qr\Form\TemplateForm'
    _title: 'Add Template'
    template_id: ''
  requirements:
    _permission: 'administer site configuration'

invitation_qr.template_edit:
  path: '/admin/invitation-qr/templates/{template_id}/edit'
  defaults:
    _form: '\Drupal\invitation_qr\Form\TemplateForm'
    _title: 'Edit Template'
  requirements:
    _permission: 'administer site configuration'

invitation_qr.template_delete:
  path: '/admin/invitation-qr/templates/{template_id}/delete'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\TemplateManagerController::deleteTemplate'
    _title: 'Delete Template'
  requirements:
    _permission: 'administer site configuration'

invitation_qr.restamp_access_cards:
  path: '/admin/invitation-qr/restamp-access/{node}'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::restampAccessCards'
    _title: 'Re-stamp Access Cards'
  requirements:
    _permission: 'administer invitation qr'
    node: \d+

invitation_qr.download_csv:
  path: '/admin/invitation-qr/submissions/{node}/csv'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::downloadCsv'
    _title: 'Download Guests CSV'
  requirements:
    _permission: 'access invitation qr submissions'
    node: \d+
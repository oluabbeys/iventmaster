invitation_qr.verify_guest:
  path: '/verify-guest'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\GuestVerifyController::verify'
    _title: 'Guest Verification'
  requirements:
    _access: 'TRUE'

invitation_qr.cron_send:
  path: '/invitation-qr/cron-send'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::cronSend'
    _title: 'Auto-Resume Pending Sends'
  methods: [GET]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE

invitation_qr.admin_settings:
  path: '/admin/config/invitation-qr/settings'
  defaults:
    _form: '\Drupal\invitation_qr\Form\InvitationQrSettingsForm'
    _title: 'Invitation QR Settings'
  requirements:
    _permission: 'administer site configuration'

invitation_qr.all_events:
  path: '/admin/invitation-qr/events'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::allEvents'
    _title: 'Invitation Events'
  requirements:
    _permission: 'access invitation qr submissions'

invitation_qr.blocklist:
  path: '/admin/invitation-qr/blocklist'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::blocklist'
    _title: 'Global Blocklist'
  requirements:
    _permission: 'administer invitation qr'

invitation_qr.blocklist_export:
  path: '/admin/invitation-qr/blocklist/export'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::blocklistExport'
    _title: 'Export Blocklist CSV'
  requirements:
    _permission: 'administer invitation qr'

invitation_qr.blocklist_remove:
  path: '/admin/invitation-qr/blocklist/remove'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::blocklistRemove'
    _title: 'Remove from Blocklist'
  methods: [POST]
  requirements:
    _permission: 'administer invitation qr'

invitation_qr.submissions_list:
  path: '/admin/invitation-qr/submissions/{node}'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::list'
    _title: 'Guest Submissions'
  requirements:
    _permission: 'access invitation qr submissions'
    node: \d+

invitation_qr.process_unstamped:
  path: '/admin/invitation-qr/process-unstamped/{node}'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::processUnstamped'
    _title: 'Process Unstamped'
  requirements:
    _permission: 'administer invitation qr'
    node: \d+

invitation_qr.generate_all:
  path: '/admin/invitation-qr/generate-all/{node}'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::generateAll'
    _title: 'Queue All QR Jobs'
  requirements:
    _permission: 'administer invitation qr'
    node: \d+

invitation_qr.send_all_twilio:
  path: '/admin/invitation-qr/send-all-twilio/{node}'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::sendAllTwilio'
    _title: 'Send All Invitations'
  requirements:
    _permission: 'administer invitation qr'
    node: \d+

invitation_qr.send_all_access_cards:
  path: '/admin/invitation-qr/send-all-access/{node}'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::sendAllAccessCards'
    _title: 'Send All Access Cards'
  requirements:
    _permission: 'administer invitation qr'
    node: \d+

invitation_qr.send_single_twilio:
  path: '/admin/invitation-qr/send-twilio/{submission}'
  defaults:
    _controller: '\Drupal\invitation_qr\Controller\SubmissionsListController::sendSingleTwilio'
